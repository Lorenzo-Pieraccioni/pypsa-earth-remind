# CN2020 — Dispatch only — Validation against Ember 2020
run:
  name: CN2020_loadCF

scenario:
  clusters: [250]
  opts: [3h]

snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: "left"

load_options:
  ssp: "ssp2-2.6"
  weather_year: 2013
  prediction_year: 2030
  scale: 1.0
  disaggregation:
    method: geospatial
    geospatial:
      source: "data/gadm_shapes_level1.geojson"
      scaling: "subregional"

build_shape_options:
  gadm_layer_id: 2
  year: 2020

electricity:
  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []
  powerplants_filter: "(DateOut >= 2020 or DateOut != DateOut) and (DateIn <= 2020 or DateIn != DateIn)"
  max_hours:
    battery: 4
    H2: 168
    PHS: 10
  estimate_renewable_capacities:
    stats: "irena"
    year: 2020

solving:
  solver:
    gurobi_hpc_tunnel:
      use_tunnel: True
      tunnel_port: 27000
      timeout_s: 15
      login_node: "03"
      gurobi_home: "/p/projects/rd3mod/gurobi1103/linux64"
      license_path: "/p/projects/rd3mod/gurobi_rc/gurobi.lic"
      verbose: "1"
      timeout: "10"
      ssl_cert: "/p/projects/rd3mod/ssl/ca-bundle.pem_2022-02-08"
      grb_cafile: "/p/projects/rd3mod/ssl/ca-bundle.pem_2022-02-08"



